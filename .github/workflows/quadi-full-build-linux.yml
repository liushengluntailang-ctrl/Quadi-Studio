name: Quadi Studio - Full Linux Build & Smoke Test

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Larger Runner label (e.g. ubuntu-24.04-8core) or self-hosted'
        required: true
        default: 'ubuntu-24.04-8core'
        type: string
      mixar_env:
        description: 'Build environment (Prod or Dev)'
        required: true
        default: 'Prod'
        type: choice
        options:
          - Prod
          - Dev

concurrency:
  group: quadi-full-build-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux-x64:
    name: Build Linux x86_64 (${{ inputs.mixar_env }})
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180

    steps:
      - name: Verify sufficient disk space (>= 50 GB)
        run: |
          set -euo pipefail
          AVAIL_GB=$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')
          echo "Available disk space on workspace: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 50 ]; then
            echo "::error::Insufficient disk space (${AVAIL_GB} GB). Blender 5.3 + LFS libs + overlay source/ + build/ requires >= 50 GB. Standard 14 GB GitHub-hosted runners cannot complete this build. Use a GitHub Larger Runner (e.g. 8-core / 300 GB SSD) or a self-hosted runner."
            exit 1
          fi

      - name: Verify sufficient memory (>= 14 GB)
        run: |
          set -euo pipefail
          TOTAL_MEM_GB=$(free -g | awk '/^Mem:/{print $2}')
          echo "Total RAM: ${TOTAL_MEM_GB} GB"
          if [ "$TOTAL_MEM_GB" -lt 14 ]; then
            echo "::warning::RAM is ${TOTAL_MEM_GB} GB; linking Blender 5.3 may OOM if parallel jobs are high."
          fi

      - name: Checkout repository (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Install Ubuntu 24.04 build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake gcc-14 g++-14 git git-lfs \
            ninja-build python3-dev python3-venv rsync pkg-config \
            libcurl4-openssl-dev libdbus-1-dev libegl-dev libgl-dev \
            libice-dev libsm-dev libwayland-dev libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxxf86vm-dev patchelf wayland-protocols \
            xz-utils xvfb zstd

      - name: Initialize pinned Blender 5.3 upstream & Linux x64 LFS libraries
        run: |
          set -euo pipefail
          git lfs install
          git submodule update --init upstream
          git -C upstream -c submodule.lib/linux_x64.update=checkout submodule update --init lib/linux_x64
          git -C upstream/lib/linux_x64 lfs pull

      - name: Configure .env from .env.example
        run: |
          set -euo pipefail
          cp .env.example .env
          grep -v -E '^(MIXAR_ENV|MIXAR_CUDA)=' .env > .env.tmp || true
          mv .env.tmp .env
          echo "MIXAR_ENV=${{ inputs.mixar_env }}" >> .env
          echo "MIXAR_CUDA=0" >> .env

      - name: Build Quadi/Mixar binary (CPU-only Cycles)
        env:
          CC: gcc-14
          CXX: g++-14
          MIXAR_CUDA: '0'
          MIXAR_ENV: ${{ inputs.mixar_env }}
        run: |
          set -euo pipefail
          make build

      - name: Verify built binary exists
        run: |
          set -euo pipefail
          BIN_PATH="build/${{ inputs.mixar_env }}/bin/mixar"
          if [ ! -x "$BIN_PATH" ]; then
            echo "::error::Expected executable not found at $BIN_PATH"
            exit 1
          fi
          ls -lh "$BIN_PATH"

      - name: Run headless Linux build smoke test
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/mixar-user-resources" "${{ runner.temp }}/smoke-out"
          MIXAR_USER_RESOURCES="${{ runner.temp }}/mixar-user-resources" \
          MIXAR_SMOKE_OUT="${{ runner.temp }}/smoke-out" \
          "build/${{ inputs.mixar_env }}/bin/mixar" \
            --background --factory-startup --python-exit-code 1 \
            --python tests/qa/linux_build_smoke.py

      - name: Package portable Linux distribution and generate SHA-256
        run: |
          set -euo pipefail
          scripts/unix/package_linux.sh --env "${{ inputs.mixar_env }}"
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Packaging failed: dist/ is empty or missing."
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload portable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quadi-linux-x86_64-${{ inputs.mixar_env }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadi-smoke-test-${{ inputs.mixar_env }}-${{ github.run_number }}
          path: ${{ runner.temp }}/smoke-out/
          if-no-files-found: warn
          retention-days: 7
